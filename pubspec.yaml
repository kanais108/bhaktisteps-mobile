name: mobile_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.11.3


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0
  dio: ^5.9.2
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  google_fonts: ^6.2.1
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  package_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/prabhupada_bg.png
    - assets/images/bs_logo.png
    - assets/images/cdmlogoabout_2.jpg


flutter_native_splash:
  color: "#FFFBF4"
  image: assets/images/bs_logo_splash.png

  android_12:
    color: "#FFFBF4"
    image: assets/images/bs_logo_splash.png

  ios: true
  android: true
  web: false
 

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/bs_logo.png
  remove_alpha_ios: true
